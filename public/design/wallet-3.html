<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suave con color pastel</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0}body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}button,a{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.page{max-width:720px;margin:0 auto;padding:32px 20px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.hero-top{display:flex;justify-content:space-between;align-items:center}.avatar{width:40px;height:40px;border-radius:50%}
.balance{display:flex;align-items:baseline;gap:10px}.num{font-size:52px;line-height:1;font-weight:700;letter-spacing:-.03em}.unit{font-size:16px;font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.hero-foot{display:flex;align-items:center;gap:8px;font-size:13.5px}.hero-foot .bar{flex:1;max-width:120px;height:4px;border-radius:4px;margin-left:auto;overflow:hidden}.hero-foot .bar span{display:block;height:100%;border-radius:4px}
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.action{display:grid;justify-items:center;gap:8px}.a-icon{position:relative;display:grid;place-items:center}.a-icon img{width:100%;height:100%;border-radius:inherit;object-fit:cover}.a-icon em{position:absolute;top:-4px;right:-8px;font-style:normal;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:99px;background:#d92d20;color:#fff;border:2px solid #fff}.a-label{font-size:12.5px;font-weight:600}
.feed{display:grid;gap:12px}.feed-head{display:flex;justify-content:space-between;align-items:baseline}.feed-head h2{font-size:17px;font-weight:700}.feed-head a{font-size:13px;font-weight:600}
.group h3{font-size:12px;font-weight:600}.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;width:100%}.r-text,.r-due{display:grid;gap:2px;min-width:0}.r-due{text-align:right}.r-text strong{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.r-text small,.r-due small{font-size:12px}.r-due b{font-size:13.5px;font-weight:700}.r-icon{display:grid;place-items:center}
@media(max-width:600px){.page{padding:16px 16px 40px;gap:22px}.num{font-size:44px}.hero-foot .bar{display:none}}body{background:#eef3fb;color:#1b2333}
.hero{background:linear-gradient(135deg,#dbeafe 0%,#e9e4fb 100%);border-radius:28px;padding:24px;display:grid;gap:14px}
.hello{font-size:14px;color:#4a5670;font-weight:600}.num{color:#1d3f8a}.unit{color:#4a5670}.avatar{background:#fff;padding:2px}
.chip{padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.75)}.c-overdue{color:#c0362c}.c-tomorrow{color:#1d63c4}
.hero-foot{margin-top:4px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.65);color:#4a5670}.hero-foot b{color:#1b2333}.hero-foot .bar{background:#dfe6f3}.hero-foot .bar span{background:linear-gradient(90deg,#6aa6f8,#9b87f5)}
.a-icon{width:56px;height:56px;border-radius:20px}.a-label{color:#4a5670}
.action:nth-child(1) .a-icon{background:#dbeafe;color:#1d63c4}.action:nth-child(2) .a-icon{background:#d9f3ea;color:#127a55}.action:nth-child(3) .a-icon{background:#fde8d7;color:#b5531a}.action:nth-child(4) .a-icon{background:#fde2e4;color:#c0362c}.action:nth-child(5) .a-icon{background:#e9e4fb}
.feed-head a{color:#1d63c4}.feed-card{background:#fff;border-radius:24px;padding:8px 18px 12px}
.group{padding:12px 0 4px}.group+.group{border-top:1px dashed #e3e8f2}.group h3{color:#8893a8;padding-bottom:6px}
.row{padding:9px 0}.r-icon{width:40px;height:40px;border-radius:14px}
.t-overdue .r-icon{background:#fde2e4;color:#c0362c}.t-today .r-icon{background:#fff1d6;color:#b26a00}.t-tomorrow .r-icon,.t-later .r-icon{background:#dbeafe;color:#1d63c4}.t-review .r-icon{background:#e9e4fb;color:#6a4fd1}
.r-text small,.r-due small{color:#8893a8}.r-due b{padding:2px 9px;border-radius:99px;font-size:12.5px}
.t-overdue .r-due b{background:#fde2e4;color:#c0362c}.t-today .r-due b{background:#fff1d6;color:#9a5b00}.t-tomorrow .r-due b,.t-later .r-due b{background:#dbeafe;color:#1d63c4}.t-review .r-due b{background:#e9e4fb;color:#6a4fd1}.r-due{justify-items:end}</style></head><body>
